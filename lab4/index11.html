<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Лабораторна 4 - Варіант 6</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <style>
    .custom-block {
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container d-flex flex-column mt-5">

    <div class="row order-12 order-sm-1">
      <div class="col-12">
        <div class="custom-block bg-dark text-white">
          <h2>Щоденник прогресу</h2>
          <p class="mb-0">Контроль набору маси</p>
        </div>
      </div>
    </div>

    <div class="row order-2 order-sm-2">
      <div class="col-12 col-md-4">
        <div class="custom-block bg-danger text-white h-100">
          <h4>Режим</h4>
          <p>Тренування 3 рази на тиждень.</p>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="custom-block bg-danger text-white h-100">
          <h4>Калорії</h4>
          <p>Цільова норма: 3150 kcal.</p>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="custom-block bg-danger text-white h-100">
          <h4>Наставництво</h4>
          <p>Програма від тренера.</p>
        </div>
      </div>
    </div>

    <div class="row order-3 order-sm-3">
      <div class="col-6 col-md-3">
        <div class="custom-block bg-warning text-dark h-100">
          <strong>Старт:</strong><br>73 кг
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="custom-block bg-warning text-dark h-100">
          <strong>Поточна:</strong><br>78 кг
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="custom-block bg-info text-white h-100">Білки</div>
      </div>
      <div class="col-4 col-md-2 d-block d-sm-none d-md-block">
        <div class="custom-block bg-info text-white h-100">Жири</div>
      </div>
      <div class="col-4 col-md-2">
        <div class="custom-block bg-info text-white h-100">Вугл.</div>
      </div>
    </div>

    <div class="row order-1 order-sm-4">
      <div class="col-12">
        <div class="custom-block bg-secondary text-white">
          <p class="mb-0">Завзятість та дисципліна — ключ до результату.</p>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>
