<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати фільм - MoviePicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Додати до агрегатора</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Про проєкт</a></li>
            <li><a href="catalog.html">Що подивитись</a></li>
            <li><a href="suggest.html">Запропонувати фільм</a></li>
        </ul>
    </nav>

    <main>
        <article style="width: 100%;">
            <section>
                <h3>Заповніть анкету</h3>
                <form action="#" method="POST">
                    <fieldset>
                        <legend>Дані про фільм</legend>
                        <label>Назва фільму:</label><br>
                        <input type="text" name="mName" required><br><br>
                        
                        <label>Ваш Email (для підтвердження):</label><br>
                        <input type="email" name="uEmail" required><br><br>
                        
                        <label>Посилання на IMDb (URL):</label><br>
                        <input type="url" name="uUrl" placeholder="https://imdb.com/..."><br><br>
                        
                        <label>Ваш телефон:</label><br>
                        <input type="tel" name="uTel" pattern="[0-9]{10}" placeholder="0XXXXXXXXX"><br><br>

                        <label>Дата прем'єри:</label><br>
                        <input type="datetime-local" name="uDate"><br><br>
                        
                        <input type="submit" value="Надіслати на модерацію">
                    </fieldset>
                </form>
            </section>
        </article>
    </main>
</body>
</html>
